# Архітектурні правила — окремий workflow, щоб не чіпати назви jobs у ci.yml (на них спирається ruleset).
# Кожне правило — швидкий скрипт без залежностей; пояснення — в ADR у docs/decisions/.
name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-tokens:
    name: "Design system: tokens only"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Перевірки лише читають файли: токен після checkout їм не потрібен.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-design-tokens.mjs

  ui-primitives:
    name: "Design system: ui components only"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Перевірки лише читають файли: токен після checkout їм не потрібен.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-ui-primitives.mjs

  server-boundary:
    name: "Secret key on the server only"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Перевірки лише читають файли: токен після checkout їм не потрібен.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-server-boundary.mjs
