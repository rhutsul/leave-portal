# Smoke розгорнутого застосунку. Скрипт — scripts/smoke.mjs; локально: npm run smoke -- <URL> [sha].
#   prod   (D0, WS8) — прод після кожного деплою main і щодня: "/", "/login", "/api/health" — коміт = main, база
#          відповідає, версія схеми = найновіша міграція коміту (гонку з db-deploy чекає до ≈ 8 хв — шапка
#          scripts/smoke.mjs), ref бази = SUPABASE_PROD_REF.
#   deploy (WS11) — КОЖЕН непродовий деплой Vercel (preview з PR і гілка staging) за адресою саме цього деплою
#          (client_payload.url), із заголовком обходу захисту Vercel; ref бази = SUPABASE_STAGING_REF (preview і
#          staging ходять лише в базу staging); гілка staging — ще й appEnv=staging і схема = міграції коміту
#          (db-deploy-staging застосовує їх на злитті в main); PR-preview — схема лише попередженням (міграції PR
#          потраплять у базу staging тільки після merge).
#   Обидва jobs при збої шлють алерт людині в Telegram (scripts/telegram-alert.mjs).
# Налаштування (Settings → Secrets and variables → Actions; у файлах і журналах — лише назви):
#   змінні репо (не секрети): PROD_URL, SUPABASE_PROD_REF, SUPABASE_STAGING_REF;
#   секрети репо: VERCEL_AUTOMATION_BYPASS_SECRET (Vercel → Deployment Protection → Protection Bypass for Automation),
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. Без Telegram — алерт пропускається з попередженням.
# Захист Vercel — Standard Protection: preview і staging закриті, прод відкритий (курс читає прод без входу).
# Події status, repository_dispatch і schedule GitHub запускає лише з файлу на гілці за замовчуванням: до merge цей
# workflow можна перевірити тільки локально (npm run smoke) чи ручним запуском після merge.
# Навмисно червоний прогін (доказ алерту, WS11 B): Actions → smoke → Run workflow, url = https://example.invalid.
# Це НЕ обов'язкова перевірка ruleset-у: деплой перевіряється після нього, а не в PR. Назви jobs у ci.yml не чіпаємо.
# Джерело: демо-репо курсу, тег ws8-03-uat; WS11 — взято з
# https://github.com/koldovsky/2026-quitcode-11-devops-operations-hw/blob/main/materials/ops-kit/.github/workflows/smoke.yml
# (поєднано з нашою перевіркою схеми й очікуванням db-deploy).
name: smoke

on:
  # Прод після деплою: commit status «Vercel» = success на коміті main. Цей статус Vercel ставить у кожному репо курсу.
  # Кожен інший commit status (CodeRabbit тощо) створює в Actions пропущений (skipped) прогін — це шум, не збій.
  status:
  # Vercel шле repository_dispatch після кожного деплою (vercel.com/docs/git/vercel-for-github):
  # production → job prod, усе інше (preview, staging) → job deploy.
  repository_dispatch:
    types: [vercel.deployment.success]
  schedule:
    - cron: "23 5 * * *" # щодня ≈ 07:23 за Києвом (зимовий час): прод живий, прод-база не «заснула»
  workflow_dispatch:
    inputs:
      url:
        description: "Адреса деплою для job deploy (порожньо = прод з PROD_URL). Навмисно червоний прогін: https://example.invalid"
        required: false
        default: ""
      sha:
        description: "Очікуваний коміт на цій адресі (необов'язково)"
        required: false
        default: ""

permissions:
  contents: read

# Група враховує context статусу і id деплою: staging після fast-forward має той самий коміт, що й прод.
# Без cancel-in-progress: прогін може чекати перемикання прод-домену (до 6 × 20 с) і db-deploy (до 25 × 20 с).
concurrency:
  group: smoke-${{ github.event_name }}-${{ github.event.context || 'na' }}-${{ github.event.client_payload.id || github.event.client_payload.git.sha || github.event.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  prod:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.url == '') ||
      (github.event_name == 'status' && github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, github.event.repository.default_branch)) ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production')
    runs-on: ubuntu-latest
    # Найгірше — 24 паузи × 20 с і 25 запитів health (route сам обриває базу за 5 с) ≈ 10 хв + checkout.
    timeout-minutes: 14
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      # Очікуваний коміт: щойно розгорнутий (status / repository_dispatch) або HEAD main (schedule, ручний запуск з main).
      EXPECT_SHA: ${{ github.event.client_payload.git.sha || github.event.sha || github.sha }}
    steps:
      # Скрипт — з main (github.sha): і після Instant Rollback на старий коміт працює свіжий smoke з перевіркою схеми.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      # Міграції — саме того коміту, що розгорнуто: найновіший файл у них — версія схеми, яку чекає код.
      # Коміт, якого вже немає в репо (force-push), — checkout упаде: smoke тоді й так нема з чим звіряти.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECT_SHA }}
          path: deployed
          sparse-checkout: supabase/migrations
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Змінна PROD_URL задана
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::error title=smoke::Немає змінної репо PROD_URL — Settings → Secrets and variables → Actions → Variables → PROD_URL = https://<проєкт>.vercel.app"
            exit 1
          fi
      - name: Прод = main, сторінка входу відкривається, база — прод, схема = міграції коміту
        run: node scripts/smoke.mjs "$PROD_URL" "$EXPECT_SHA"
        env:
          SMOKE_MIGRATIONS_DIR: deployed/supabase/migrations
          SMOKE_FAIL_FILE: ${{ runner.temp }}/smoke-fail.txt
          SMOKE_EXPECT_REF: ${{ vars.SUPABASE_PROD_REF }}
          # Прод відкритий (Standard Protection), але заголовок не шкодить, якщо колись увімкнуть All Deployments.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Алерт людині в Telegram (лише якщо щось червоне)
        if: failure()
        run: node scripts/telegram-alert.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ENV: production
          ALERT_URL: ${{ vars.PROD_URL }}
          ALERT_JOB: ${{ github.job }}
          ALERT_SHA: ${{ env.EXPECT_SHA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_FAIL_FILE: ${{ runner.temp }}/smoke-fail.txt

  deploy:
    # WS11: кожен НЕпродовий деплой (preview з PR і гілка staging) — за адресою саме цього деплою, а не фіксованою
    # адресою проду. Ручний запуск з полем url — теж сюди.
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.client_payload.environment != 'production') ||
      (github.event_name == 'workflow_dispatch' && inputs.url != '')
    runs-on: ubuntu-latest
    # Гілка staging може чекати db-deploy-staging так само, як прод — db-deploy.
    timeout-minutes: 14
    env:
      DEPLOY_URL: ${{ github.event.client_payload.url || inputs.url }}
      EXPECT_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
      DEPLOY_ENV: ${{ github.event.client_payload.environment || 'manual' }}
      DEPLOY_BRANCH: ${{ github.event.client_payload.git.ref || '' }}
    steps:
      # repository_dispatch завжди бере останній коміт main — звідти лише scripts/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      # Міграції розгорнутого коміту (гілка PR чи staging). Немає коміту (ручний запуск без sha, гілку видалено) —
      # не збій: версію схеми тоді не перевіряємо (скрипт попередить).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.EXPECT_SHA != ''
        continue-on-error: true
        with:
          ref: ${{ env.EXPECT_SHA }}
          path: deployed
          sparse-checkout: supabase/migrations
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Що перевіряємо
        env:
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error title=smoke::Немає адреси деплою (client_payload.url чи поле url ручного запуску)"
            exit 1
          fi
          if [ "$HAS_BYPASS" != "true" ]; then
            echo "::warning title=smoke::Немає секрету VERCEL_AUTOMATION_BYPASS_SECRET — захищений деплой відповість стіною входу Vercel."
          fi
          echo "Середовище: $DEPLOY_ENV; гілка: ${DEPLOY_BRANCH:-?}; коміт: ${EXPECT_SHA:0:7}"
      - name: Деплой відкривається з обходом захисту, база — staging, коміт той самий
        run: node scripts/smoke.mjs "$DEPLOY_URL" "$EXPECT_SHA"
        env:
          SMOKE_TARGET: deploy
          SMOKE_MIGRATIONS_DIR: deployed/supabase/migrations
          SMOKE_FAIL_FILE: ${{ runner.temp }}/smoke-fail.txt
          SMOKE_EXPECT_REF: ${{ vars.SUPABASE_STAGING_REF }}
          # Гілка staging: своя змінна і схема = міграції коміту; PR-preview: схема лише попередженням.
          SMOKE_EXPECT_APP_ENV: ${{ github.event.client_payload.git.ref == 'staging' && 'staging' || '' }}
          SMOKE_SCHEMA: ${{ github.event.client_payload.git.ref == 'staging' && 'strict' || 'warn' }}
          # Значення — лише з GitHub Secrets; скрипт надсилає його заголовком і не друкує.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Алерт людині в Telegram (лише якщо щось червоне)
        if: failure()
        run: node scripts/telegram-alert.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_ENV: ${{ env.DEPLOY_ENV }}
          ALERT_BRANCH: ${{ env.DEPLOY_BRANCH }}
          ALERT_URL: ${{ env.DEPLOY_URL }}
          ALERT_JOB: ${{ github.job }}
          ALERT_SHA: ${{ env.EXPECT_SHA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_FAIL_FILE: ${{ runner.temp }}/smoke-fail.txt
