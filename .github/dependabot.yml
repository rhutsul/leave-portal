# Взято з https://github.com/koldovsky/2026-quitcode-11-devops-operations-hw/blob/main/materials/ops-kit/.github/dependabot.yml (+ винятки стеку leave-portal нижче).
# Dependabot: щотижневі PR з оновленнями npm-пакетів і дій GitHub — з паузою для свіжих версій і групами.
# Куди: .github/dependabot.yml у вашому репо (файл новий; у шаблоні його немає).
# Завдання README: D (ланцюг постачання). Секретів не потребує.
# Джерело: GitHub Docs «Dependabot options reference» (cooldown, groups, ignore), станом на 09.11.2026.
#
# Що тут і навіщо:
# - cooldown (пауза): Dependabot не пропонує версію, доки їй не виповниться N днів. Шкідливі версії пакетів зазвичай
#   знаходять і знімають у перші дні — пауза не дає їм потрапити до вас. Узгоджено з .npmrc min-release-age=7.
#   Пауза НЕ діє на оновлення безпеки (security updates) — вони приходять одразу, якщо в Settings → Code security
#   увімкнено Dependabot security updates (окремий перемикач).
# - groups: дрібні оновлення приходять одним PR, а не десятком.
# - ignore: Supabase CLI 3.x змінює поведінку команд (без --remote вони йдуть у локальну базу) — до demo day лишаємось
#   на закріпленій 2.x, тому мажорне оновлення пакета supabase не пропонуємо.
# - github-actions: Dependabot оновлює дії, закріплені за SHA, разом із коментарем версії (# vX.Y.Z).
#   Для цієї екосистеми cooldown підтримує лише default-days.
# Перевірка: Insights → Dependency graph → Dependabot (останній запуск) або вкладка Pull requests (автор dependabot).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # leave-portal: стек закріплено в AGENTS.md («не оновлювати без ADR»): Next 16.4, React 19.3, Supabase CLI 2.120
      # — лише патчі (безпекові релізи на кшталт next 16.4.5 проходять); мінорні й мажорні — через ADR. TypeScript 7 і
      # ESLint 10 шаблон не перевіряв. OpenSpec має збігатися з глобальним CLI 1.14.1. supabase-js 2.117, ssr 0.12 і
      # shadcn CLI 4.22.1 — теж зі стеку AGENTS.md (група #103 18.11 принесла 2.119 і 4.23 — закрито).
      - dependency-name: supabase
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@supabase/supabase-js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@supabase/ssr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: shadcn
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: next
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fission-ai/openspec"
      # Node 24 скрізь (engines, Vercel, CI): типи новішого Node дозволили б код, якого Node 24 не виконає. Мажорну
      # версію @types/node — разом із переходом на новий Node (ADR). #104 (26) і #109 (25) закрито.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 1.6.28 (patch!) вимагає peer typescript >=6.0.0, а стек — TypeScript 5 (typescript-eslint 8: <6.1.0):
      # `npm install` на Vercel падає з ERESOLVE, хоча CI з `npm ci` зелений (група #108, 20.11.2026). Прибрати цей
      # рядок разом із переходом на TypeScript 6 окремим PR (ADR) — тоді 1.6.28+ стане сумісним.
      - dependency-name: "@vitest/eslint-plugin"
        versions: [">=1.6.28"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
